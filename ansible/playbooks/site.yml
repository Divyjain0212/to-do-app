---
- name: Configure and start app servers
  hosts: "{{ target_hosts | default('app') }}"
  become: true

  tasks:
    - name: Create systemd service for todo-app
      copy:
        dest: /etc/systemd/system/todo-app.service
        mode: "0644"
        content: |
          [Unit]
          Description=Todo Flask Application (Docker)
          After=docker.service
          Requires=docker.service

          [Service]
          Type=simple
          User=root
          Restart=always
          RestartSec=5
          EnvironmentFile=/etc/todo-app/app.env

          ExecStartPre=-/usr/bin/docker stop todo-app
          ExecStartPre=-/usr/bin/docker rm todo-app
          ExecStartPre=/usr/bin/docker pull {{ docker_image_uri }}
          ExecStart=/usr/bin/docker run --rm \
            --name todo-app \
            -p 8000:8000 \
            --env-file /etc/todo-app/app.env \
            --health-cmd="curl -f http://localhost:8000/health || exit 1" \
            --health-interval=30s \
            --health-timeout=10s \
            --health-retries=3 \
            {{ docker_image_uri }}
          ExecStop=/usr/bin/docker stop -t 10 todo-app

          [Install]
          WantedBy=multi-user.target

    - name: Start Docker service
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Reload systemd daemon
      systemd:
        daemon_reload: true

    - name: Enable and start todo-app service
      systemd:
        name: todo-app
        enabled: true
        state: started