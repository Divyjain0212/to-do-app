---
- name: Configure app server
  hosts: localhost
  connection: local
  become: true
  vars:
    docker_image: divyj0212/todoapp:latest
    app_port: 8000

  tasks:
    # ── Install Docker ────────────────────────────────────────────────────────
    - name: Install Docker dependencies
      apt:
        name: [ca-certificates, curl]
        state: present
        update_cache: true

    - name: Create Docker keyring directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      shell: |
        . /etc/os-release
        echo "Types: deb
        URIs: https://download.docker.com/linux/ubuntu
        Suites: ${UBUNTU_CODENAME:-$VERSION_CODENAME}
        Components: stable
        Architectures: $(dpkg --print-architecture)
        Signed-By: /etc/apt/keyrings/docker.asc" > /etc/apt/sources.list.d/docker.sources
      args:
        creates: /etc/apt/sources.list.d/docker.sources

    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    # ── Configure Docker ──────────────────────────────────────────────────────
    - name: Start and enable Docker service
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    # ── Deploy App ────────────────────────────────────────────────────────────
    - name: Pull latest Docker image
      command: docker pull {{ docker_image }}

    - name: Create todo-app systemd service
      copy:
        dest: /etc/systemd/system/todo-app.service
        mode: "0644"
        content: |
          [Unit]
          Description=Todo App (Docker)
          After=docker.service
          Requires=docker.service

          [Service]
          Restart=always
          RestartSec=5
          EnvironmentFile=/etc/todo-app/app.env
          ExecStartPre=-/usr/bin/docker stop todo-app
          ExecStartPre=-/usr/bin/docker rm todo-app
          ExecStartPre=/usr/bin/docker pull {{ docker_image }}
          ExecStart=/usr/bin/docker run --rm \
            --name todo-app \
            -p {{ app_port }}:{{ app_port }} \
            --env-file /etc/todo-app/app.env \
            --log-driver=journald \
            {{ docker_image }}
          ExecStop=/usr/bin/docker stop -t 10 todo-app

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd and start todo-app service
      systemd:
        name: todo-app
        daemon_reload: true
        enabled: true
        state: started
