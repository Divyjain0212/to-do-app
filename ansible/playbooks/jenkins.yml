---
- name: Install Java runtime on app instances
  hosts: app
  become: true
  tasks:
    - name: Run apt update
      apt:
        update_cache: true

    - name: Install Java runtime packages
      apt:
        name:
          - fontconfig
          - openjdk-21-jre
        state: present

    - name: Check Java version
      command: java -version
      register: java_version
      changed_when: false

    - name: Print Java version output
      debug:
        var: java_version.stderr_lines
